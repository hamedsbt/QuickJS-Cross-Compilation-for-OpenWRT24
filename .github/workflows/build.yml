name: Build QuickJS for OpenWrt 24.10 (Pi 4, aarch64)

on:
  workflow_dispatch:

jobs:
  build-quickjs:
    runs-on: ubuntu-latest

    env:
      OPENWRT_VERSION: 24.10.5
      TARGET_ARCH: aarch64
      TARGET_CPU: cortex-a72
      QUICKJS_VERSION: 2025-09-13

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ------------------------------------------------------------
    # OpenWrt SDK
    # ------------------------------------------------------------
    - name: Download OpenWrt SDK
      run: |
        set -e
        SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/bcm27xx/bcm2711/openwrt-sdk-${OPENWRT_VERSION}-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst"

        wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
        tar --zstd -xf sdk.tar.zst
        mv openwrt-sdk-* openwrt-sdk

        echo "OPENWRT_SDK=$PWD/openwrt-sdk" >> $GITHUB_ENV
        echo "STAGING_DIR=$PWD/openwrt-sdk/staging_dir" >> $GITHUB_ENV

    # ------------------------------------------------------------
    # Toolchain
    # ------------------------------------------------------------
    - name: Setup toolchain
      run: |
        set -e

        TOOLCHAIN=$(find "$STAGING_DIR" -maxdepth 1 -type d -name "toolchain-aarch64*" | head -1)
        [ -d "$TOOLCHAIN" ]

        echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
        echo "SYSROOT=$TOOLCHAIN" >> $GITHUB_ENV
        echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_ENV
        echo "TARGET_PREFIX=aarch64-openwrt-linux-" >> $GITHUB_ENV

        "$TOOLCHAIN/bin/aarch64-openwrt-linux-gcc" --version

    # ------------------------------------------------------------
    # QuickJS source
    # ------------------------------------------------------------
    - name: Fetch QuickJS
      run: |
        set -e
        wget -q https://bellard.org/quickjs/quickjs-${QUICKJS_VERSION}.tar.xz
        tar -xf quickjs-${QUICKJS_VERSION}.tar.xz
        mv quickjs-${QUICKJS_VERSION} quickjs
        echo "QUICKJS_SRC=$PWD/quickjs" >> $GITHUB_ENV

    # ------------------------------------------------------------
    # Minimal musl compatibility patches (SAFE)
    # ------------------------------------------------------------
    - name: Apply minimal patches
      run: |
        set -e
        cd "$QUICKJS_SRC"

        # SIGPIPE cast (harmless but avoids warnings)
        sed -i 's/signal(SIGPIPE, SIG_IGN);/signal(SIGPIPE, (void (*)(int))SIG_IGN);/' quickjs-libc.c || true

        # Ensure environ symbol exists
        grep -q 'extern char \*\*environ;' quickjs-libc.c || \
          sed -i '/#include <stdlib.h>/a extern char **environ;' quickjs-libc.c

    # ------------------------------------------------------------
    # Build
    # ------------------------------------------------------------
    - name: Build QuickJS
      run: |
        set -e
        cd "$QUICKJS_SRC"

        export CC="${TARGET_PREFIX}gcc"
        export AR="${TARGET_PREFIX}ar"
        export RANLIB="${TARGET_PREFIX}ranlib"
        export STRIP="${TARGET_PREFIX}strip"

        export CFLAGS="--sysroot=$SYSROOT -Os -pipe -ffunction-sections -fdata-sections -D_GNU_SOURCE -D_DEFAULT_SOURCE"
        export LDFLAGS="--sysroot=$SYSROOT -Wl,--gc-sections"

        make clean || true
        make -j$(nproc) qjs qjsc

        $STRIP qjs qjsc

        file qjs

    # ------------------------------------------------------------
    # Package artifacts
    # ------------------------------------------------------------
    - name: Package artifacts
      run: |
        mkdir -p artifacts
        cp quickjs/qjs artifacts/
        cp quickjs/qjsc artifacts/

        cat > artifacts/README.txt <<'EOF'
        QuickJS for OpenWrt 24.10 (bcm2711 / Pi 4)

        Install:
          scp qjs root@router:/opt/app/ytdlp/
          chmod +x /opt/app/ytdlp/qjs

        yt-dlp:
          yt-dlp --js-runtimes quickjs:/opt/app/ytdlp/qjs -F URL
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quickjs-openwrt-24.10-pi4
        path: artifacts/
        retention-days: 7
