name: QuickJS OpenWrt 24.10 (aarch64 musl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout QuickJS
        uses: actions/checkout@v4
        with:
          repository: bellard/quickjs
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            file \
            wget \
            xz-utils \
            python3

      - name: Download OpenWrt 24.10 SDK (aarch64 cortex-a72 musl)
        run: |
          wget -q https://downloads.openwrt.org/releases/24.10.5/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          tar -xf openwrt-sdk-24.10.0-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.xz

      - name: Setup OpenWrt toolchain (CRITICAL FIX)
        run: |
          SDK=$(pwd)/openwrt-sdk-24.10.0-bcm27xx-bcm2711_gcc-13.3.0_musl
          STAGING=$SDK/staging_dir

          TOOLCHAIN=$(find "$STAGING" -maxdepth 1 -type d -name "toolchain-aarch64*" | head -1)
          TARGETSYS=$(find "$STAGING" -maxdepth 1 -type d -name "target-aarch64*_musl" | head -1)

          echo "TOOLCHAIN=$TOOLCHAIN"
          echo "TARGETSYS=$TARGETSYS"

          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "SYSROOT=$TARGETSYS" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_ENV

          echo "CC=aarch64-openwrt-linux-gcc" >> $GITHUB_ENV
          echo "AR=aarch64-openwrt-linux-ar" >> $GITHUB_ENV
          echo "RANLIB=aarch64-openwrt-linux-ranlib" >> $GITHUB_ENV
          echo "STRIP=aarch64-openwrt-linux-strip" >> $GITHUB_ENV

          echo "CFLAGS=--sysroot=$TARGETSYS -Os -pipe -ffunction-sections -fdata-sections -D_GNU_SOURCE -D_DEFAULT_SOURCE" >> $GITHUB_ENV
          echo "LDFLAGS=--sysroot=$TARGETSYS -Wl,--gc-sections" >> $GITHUB_ENV

      - name: Clean QuickJS
        run: |
          make clean || true

      - name: Build QuickJS (qjs + qjsc)
        run: |
          make -j$(nproc)

      - name: Verify binaries
        run: |
          file qjs qjsc
          readelf -l qjs | grep interpreter || true

      - name: Strip binaries
        run: |
          $STRIP qjs qjsc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-openwrt-aarch64
          path: |
            qjs
            qjsc
