name: Build QuickJS for OpenWrt 24.10 (bcm2711)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            tar \
            zstd \
            xz-utils

      - name: Download OpenWrt SDK
        run: |
          set -e
          SDK_URL="https://downloads.openwrt.org/releases/24.10.5/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          wget -q "$SDK_URL"
          tar --zstd -xf openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst

      - name: Setup OpenWrt toolchain environment
        run: |
          set -euo pipefail

          SDK_DIR="$(ls -d openwrt-sdk-* | head -n1)"
          STAGING="$PWD/$SDK_DIR/staging_dir"

          TOOLCHAIN="$(find "$STAGING" -maxdepth 1 -type d -name 'toolchain-aarch64*' | head -n1)"
          SYSROOT="$(find "$STAGING" -maxdepth 1 -type d -name 'target-aarch64*' | head -n1)"

          if [ -z "$TOOLCHAIN" ] || [ -z "$SYSROOT" ]; then
            echo "ERROR: toolchain or sysroot not found"
            exit 1
          fi

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_PATH

          echo "CC=$TOOLCHAIN/bin/aarch64-openwrt-linux-gcc" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/aarch64-openwrt-linux-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/aarch64-openwrt-linux-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/aarch64-openwrt-linux-strip" >> $GITHUB_ENV

          echo "CFLAGS=-Os -pipe -ffunction-sections -fdata-sections -D_GNU_SOURCE -D_DEFAULT_SOURCE" >> $GITHUB_ENV
          echo "LDFLAGS=-Wl,--gc-sections" >> $GITHUB_ENV

          aarch64-openwrt-linux-gcc --version

      - name: Build QuickJS
        run: |
          set -e
          make clean
          make -j$(nproc)

      - name: Strip binaries
        run: |
          set -e
          $STRIP qjs qjsc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-openwrt-bcm2711
          path: |
            qjs
            qjsc
