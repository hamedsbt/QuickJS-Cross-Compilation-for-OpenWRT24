name: Build QuickJS for OpenWrt 24.10 (bcm2711 / aarch64)

on:
  workflow_dispatch:

env:
  OPENWRT_SDK_URL: "https://downloads.openwrt.org/releases/24.10.5/targets/bcm27xx/bcm2711/openwrt-sdk-24.10.5-bcm27xx-bcm2711_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
  QUICKJS_VERSION: "2025-09-13"
  QUICKJS_TARBALL: "quickjs-2025-09-13.tar.xz"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Prepare runner
      run: |
        sudo apt-get update -y
        sudo apt-get install -y wget xz-utils zstd build-essential file

    - name: Download OpenWrt SDK
      run: |
        set -euo pipefail
        echo "Downloading OpenWrt SDK..."
        wget -q --show-progress "$OPENWRT_SDK_URL" -O openwrt-sdk.tar.zst
        tar --zstd -xf openwrt-sdk.tar.zst
        SDK_DIR="$(ls -d openwrt-sdk-* | head -n1)"
        if [ -z "$SDK_DIR" ]; then
          echo "ERROR: SDK extraction failed"
          ls -la
          exit 1
        fi
        echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
        ls -ld "$SDK_DIR"

    - name: Download QuickJS source
      run: |
        set -euo pipefail
        wget -q "https://bellard.org/quickjs/quickjs-${QUICKJS_VERSION}.tar.xz" -O "${QUICKJS_TARBALL}"
        tar -xf "${QUICKJS_TARBALL}"
        QUICKJS_DIR="quickjs-${QUICKJS_VERSION}"
        if [ ! -d "$QUICKJS_DIR" ]; then
          echo "ERROR: QuickJS source not found"
          ls -la
          exit 1
        fi
        echo "QUICKJS_DIR=$QUICKJS_DIR" >> $GITHUB_ENV
        ls -ld "$QUICKJS_DIR"

    - name: Setup OpenWrt toolchain (make compiler available now)
      run: |
        set -euo pipefail

        SDK_DIR="${{ env.SDK_DIR }}"
        STAGING="$PWD/$SDK_DIR/staging_dir"

        TOOLCHAIN="$(find "$STAGING" -maxdepth 1 -type d -name 'toolchain-aarch64*' | head -n1)"
        SYSROOT="$(find "$STAGING" -maxdepth 1 -type d -name 'target-aarch64*' | head -n1)"

        if [ -z "$TOOLCHAIN" ] || [ -z "$SYSROOT" ]; then
          echo "ERROR: toolchain or sysroot not found in $STAGING"
          ls -la "$STAGING" || true
          exit 1
        fi

        echo "Found TOOLCHAIN: $TOOLCHAIN"
        echo "Found SYSROOT:   $SYSROOT"

        # Make cross tools available in this step immediately
        export PATH="$TOOLCHAIN/bin:$PATH"

        # Verify compiler is available now
        aarch64-openwrt-linux-gcc --version

        # Persist for later steps
        echo "PATH=$TOOLCHAIN/bin:$PATH" >> $GITHUB_PATH
        echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
        echo "SYSROOT=$SYSROOT" >> $GITHUB_ENV

        echo "CC=$TOOLCHAIN/bin/aarch64-openwrt-linux-gcc" >> $GITHUB_ENV
        echo "AR=$TOOLCHAIN/bin/aarch64-openwrt-linux-ar" >> $GITHUB_ENV
        echo "RANLIB=$TOOLCHAIN/bin/aarch64-openwrt-linux-ranlib" >> $GITHUB_ENV
        echo "STRIP=$TOOLCHAIN/bin/aarch64-openwrt-linux-strip" >> $GITHUB_ENV

        # Helpful environment variables for the Makefile
        echo "STAGING_DIR=$STAGING" >> $GITHUB_ENV
        echo "CFLAGS_BASE=--sysroot=$SYSROOT -Os -pipe -ffunction-sections -fdata-sections -D_GNU_SOURCE -D_DEFAULT_SOURCE" >> $GITHUB_ENV
        echo "LDFLAGS_BASE=--sysroot=$SYSROOT -Wl,--gc-sections" >> $GITHUB_ENV

    - name: Apply safe patches and create config.h
      run: |
        set -euo pipefail
        cd "${{ env.QUICKJS_DIR }}"

        # Small safe patches:
        sed -i 's/signal(SIGPIPE, SIG_IGN);/signal(SIGPIPE, (void (*)(int))SIG_IGN);/' quickjs-libc.c || true
        grep -q 'extern char \*\*environ;' quickjs-libc.c || sed -i '/#include <stdlib.h>/a extern char **environ;' quickjs-libc.c || true

        # Create config.h that defines CONFIG_VERSION as a string literal (prevents parsing issues)
        cat > config.h <<'EOF'
        #ifndef CONFIG_H
        #define CONFIG_H
        #define CONFIG_VERSION "2025-09-13"
        #endif
        EOF

        # confirm
        sed -n '1,120p' config.h

    - name: Build QuickJS (OpenWrt aarch64) — FORCE cross tools
      env:
        TOOLCHAIN: ${{ env.TOOLCHAIN }}
        SYSROOT: ${{ env.SYSROOT }}
        QUICKJS_VERSION: ${{ env.QUICKJS_VERSION }}
      run: |
        set -euo pipefail
        cd "${{ env.QUICKJS_DIR }}"

        # cleanup (upstream Makefile has no 'make clean')
        rm -rf .obj *.o *.a *.d qjs qjsc libquickjs.a || true

        # Ensure toolchain on PATH for this step (absolute path)
        export PATH="${TOOLCHAIN}/bin:$PATH"

        # Absolute cross-tool binaries (avoid relying on Makefile defaults)
        CROSS_CC="${TOOLCHAIN}/bin/aarch64-openwrt-linux-gcc"
        CROSS_AR="${TOOLCHAIN}/bin/aarch64-openwrt-linux-ar"
        CROSS_RANLIB="${TOOLCHAIN}/bin/aarch64-openwrt-linux-ranlib"
        CROSS_STRIP="${TOOLCHAIN}/bin/aarch64-openwrt-linux-strip"

        # Sysroot and include flags
        SYSROOT="${SYSROOT}"
        CPPFLAGS="-I${SYSROOT}/usr/include -I. -include config.h -D_GNU_SOURCE -D_DEFAULT_SOURCE"

        CFLAGS="--sysroot=${SYSROOT} -Os -pipe -ffunction-sections -fdata-sections -D_GNU_SOURCE -D_DEFAULT_SOURCE -DCONFIG_VERSION=\"0\""

        LDFLAGS="--sysroot=${SYSROOT} -Wl,--gc-sections"

        # Sanity
        echo "Using CROSS_CC=${CROSS_CC}"
        $CROSS_CC --version

        # IMPORTANT: pass the cross tools as make variables on the command line
        # This forces Makefile to use them regardless of its CC=... setting.
        make -j$(nproc) \
          CC="${CROSS_CC}" \
          AR="${CROSS_AR}" \
          RANLIB="${CROSS_RANLIB}" \
          STRIP="${CROSS_STRIP}" \
          CPPFLAGS="${CPPFLAGS}" \
          CFLAGS="${CFLAGS}" \
          LDFLAGS="${LDFLAGS}" \
          libquickjs.a

        make -j$(nproc) \
          CC="${CROSS_CC}" \
          AR="${CROSS_AR}" \
          RANLIB="${CROSS_RANLIB}" \
          STRIP="${CROSS_STRIP}" \
          CPPFLAGS="${CPPFLAGS}" \
          CFLAGS="${CFLAGS}" \
          LDFLAGS="${LDFLAGS}" \
          qjs qjsc

        # show artifacts
        ls -lh qjs qjsc libquickjs.a || true

    - name: Strip and verify artifacts
      run: |
        set -euo pipefail
        cd "${{ env.QUICKJS_DIR }}"

        if [ -n "${{ env.STRIP }}" ] && [ -x "${{ env.STRIP }}" ]; then
          "${{ env.STRIP }}" qjs qjsc || true
        fi

        echo "Artifacts info:"
        file qjs qjsc || true
        readelf -l qjs | sed -n '1,120p' || true

    - name: Package artifacts
      run: |
        set -euo pipefail
        cd "${{ env.QUICKJS_DIR }}"
        mkdir -p artifacts
        cp qjs qjsc libquickjs.a artifacts/ || true
        printf "QuickJS %s (OpenWrt aarch64)\n" "${QUICKJS_VERSION}" > artifacts/README.txt
        ls -lh artifacts

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quickjs-openwrt-aarch64-${{ env.QUICKJS_VERSION }}
        path: artifacts/
